<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox | Mailbox Cavela</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #fff5f6;
      --card-bg: #ffffff;
      --berry-dark: #5c1624;
      --berry-red: #ff3b5c;
      --berry-soft: #ff758f;
      --berry-pastel: #ffe3e8;
      --berry-border: #f8bbd0;
      --leaf-green: #2ecc71;
      --text-muted: #9e6b75;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-cream);
      background-image: radial-gradient(#ffd1da 1.5px, transparent 1.5px), radial-gradient(#ffe5ec 1.5px, var(--bg-cream) 1.5px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--berry-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 16px 36px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(255, 59, 92, 0.08);
      border: 2px solid #fff;
      position: relative;
    }

    .header-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 22px;
    }

    .brand-title { text-align: center; }
    .brand-title h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.65rem;
      color: var(--berry-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.1;
    }

    .brand-title span.subtitle {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--berry-red);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .theme-btn {
      position: absolute;
      right: 18px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--berry-pastel);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--berry-red);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .theme-btn:hover {
      transform: rotate(15deg) scale(1.06);
      background: #ffd0d9;
    }

    .theme-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 18px;
      background: #ffffff;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 12px 28px rgba(92, 22, 36, 0.14);
      border: 1.5px solid var(--berry-pastel);
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .theme-menu.open { display: flex; animation: popDown 0.18s ease-out; }

    @keyframes popDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-option {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--berry-dark);
      transition: background 0.15s;
    }

    .theme-option:hover { background: var(--berry-pastel); }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; }

    .email-card-title {
      text-align: center;
      font-weight: 700;
      font-size: 1.02rem;
      color: var(--berry-dark);
      margin-bottom: 16px;
    }

    .form-grid { display: flex; gap: 12px; align-items: stretch; }
    .inputs-col { flex: 1; display: flex; flex-direction: column; gap: 10px; position: relative; }

    .input-box {
      width: 100%;
      padding: 13px 16px;
      border-radius: 15px;
      border: 1.8px solid var(--berry-border);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--berry-dark);
      background: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-box::placeholder { color: #c99aa3; font-weight: 500; }
    .input-box:focus { border-color: var(--berry-red); box-shadow: 0 0 0 3px rgba(255, 59, 92, 0.12); }

    .select-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-color: #9e3d50;
    }

    .select-trigger svg { transition: transform 0.25s ease; }
    .select-trigger.active svg { transform: rotate(180deg); }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 105%;
      background: #ffffff;
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 12px 28px rgba(92, 22, 36, 0.14);
      border: 1.5px solid var(--berry-pastel);
      z-index: 30;
      display: none;
    }

    .dropdown-menu.open { display: block; animation: popDown 0.18s ease-out; }

    .dropdown-option {
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.96rem;
      color: var(--berry-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .dropdown-option:hover { background: var(--berry-pastel); color: var(--berry-red); }

    .submit-arrow-btn {
      width: 56px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(180deg, var(--berry-soft) 0%, var(--berry-red) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 59, 92, 0.28);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .submit-arrow-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .submit-arrow-btn:active { transform: scale(0.96); }

    .active-email-bar {
      margin-top: 12px;
      background: var(--berry-pastel);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--berry-dark);
    }

    .copy-badge {
      background: #fff;
      color: var(--berry-red);
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(255, 59, 92, 0.12);
    }

    .inbox-card { min-height: 330px; display: flex; flex-direction: column; }
    .inbox-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .inbox-status-group { display: flex; flex-direction: column; gap: 6px; }
    .inbox-title-row { display: flex; align-items: center; gap: 10px; }
    .inbox-title-row h2 { font-size: 1.25rem; font-weight: 700; color: var(--berry-dark); }

    .badge-active {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--berry-pastel);
      color: var(--berry-red);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 99px;
    }

    .dot-green {
      width: 8px; height: 8px;
      background-color: var(--leaf-green);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2);
    }

    .msg-counter { font-size: 0.88rem; font-weight: 600; color: var(--text-muted); }

    .refresh-btn {
      background: var(--berry-pastel);
      border: none;
      border-radius: 14px;
      padding: 9px 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.86rem;
      color: var(--berry-dark);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .refresh-btn:hover { background: #ffd0d9; }
    .spin { animation: rotateSpin 0.6s ease-in-out; }

    @keyframes rotateSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #inboxContentArea {
      max-height: 460px;
      overflow-y: auto;
      padding-right: 2px;
    }

    /* Kotak Pesan Masuk */
    .email-item {
      background: var(--bg-cream);
      border: 1.8px solid var(--berry-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      word-break: break-word;
      box-shadow: 0 4px 12px rgba(92, 22, 36, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .email-header-clickable {
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .open-modal-btn {
      background: var(--berry-pastel);
      color: var(--berry-red);
      border: none;
      padding: 5px 10px;
      border-radius: 10px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .open-modal-btn:hover {
      background: var(--berry-red);
      color: #fff;
    }

    /* Kontainer Iframe untuk merender gambar & HTML email */
    .email-body-wrapper {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid var(--berry-border);
      margin-top: 10px;
      overflow: hidden;
    }

    .email-iframe {
      width: 100%;
      min-height: 260px;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* MODAL POPUP (Tampilan Penuh seperti gambar contoh) */
    .email-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 10, 14, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .email-modal-overlay.open {
      display: flex;
      animation: popDown 0.2s ease-out;
    }

    .email-modal-box {
      width: 100%;
      max-width: 480px;
      height: 88vh;
      background: var(--card-bg);
      border-radius: 24px;
      border: 2px solid var(--berry-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .modal-top-bar {
      padding: 18px 20px;
      background: var(--bg-cream);
      border-bottom: 1.5px solid var(--berry-border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .modal-subject {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--berry-dark);
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .modal-meta {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .modal-close-btn {
      background: var(--berry-pastel);
      color: var(--berry-dark);
      border: none;
      padding: 7px 14px;
      border-radius: 12px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-close-btn:hover {
      background: var(--berry-red);
      color: #fff;
    }

    .modal-iframe-container {
      flex: 1;
      background: #ffffff;
      padding: 8px;
      overflow: hidden;
    }

    .modal-iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 14px;
      background: #ffffff;
    }

    .empty-inbox {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 36px 16px 20px;
    }

    .empty-icon { color: #edd5d9; margin-bottom: 16px; }
    .empty-inbox h3 { font-size: 1.18rem; font-weight: 700; color: var(--berry-dark); margin-bottom: 8px; }
    .empty-inbox p { font-size: 0.94rem; font-weight: 600; color: var(--text-muted); max-width: 250px; line-height: 1.5; }

    footer { text-align: center; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- HEADER -->
    <header class="card header-card">
      <div class="brand-title">
        <h1>🍓 Mailbox</h1>
        <span class="subtitle">Cavela</span>
      </div>
      
      <button class="theme-btn" id="themeToggleBtn" title="Ganti Tema Warna" aria-label="Theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
          <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
          <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
          <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
        </svg>
      </button>

      <div class="theme-menu" id="themeMenu">
        <div class="theme-option" data-theme="strawberry"><span class="color-dot" style="background: #ff3b5c;"></span> Strawberry</div>
        <div class="theme-option" data-theme="matcha"><span class="color-dot" style="background: #27ae60;"></span> Matcha</div>
        <div class="theme-option" data-theme="blueberry"><span class="color-dot" style="background: #2980b9;"></span> Blueberry</div>
        <div class="theme-option" data-theme="taro"><span class="color-dot" style="background: #8e44ad;"></span> Taro</div>
      </div>
    </header>

    <!-- CUSTOM EMAIL BOX -->
    <section class="card">
      <div class="email-card-title">Custom Email</div>

      <div class="form-grid">
        <div class="inputs-col">
          <input type="text" id="usernameInput" class="input-box" placeholder="Enter Username" autocomplete="off">

          <div class="input-box select-trigger" id="domainTrigger">
            <span id="selectedDomainText">cavela.my.id</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <div class="dropdown-menu" id="domainMenu">
            <div class="dropdown-option" data-domain="cavela.my.id">🍓 cavela.my.id</div>
          </div>
        </div>

        <button class="submit-arrow-btn" id="setEmailBtn" aria-label="Buat Email">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <div class="active-email-bar">
        <span id="currentEmailDisplay">berrysweet@cavela.my.id</span>
        <button class="copy-badge" id="copyBtn">Salin</button>
      </div>
    </section>

    <!-- INBOX BOX -->
    <main class="card inbox-card">
      <div class="inbox-top">
        <div class="inbox-status-group">
          <div class="inbox-title-row">
            <h2>Inbox</h2>
            <span class="badge-active"><span class="dot-green"></span> Inbox active</span>
          </div>
          <div class="msg-counter">0 pesan masuk</div>
        </div>

        <button class="refresh-btn" id="refreshBtn">
          <svg id="refreshIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
          Refresh
        </button>
      </div>

      <div id="inboxContentArea">
        <div class="empty-inbox">
          <div class="empty-icon">
            <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
              <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
            </svg>
          </div>
          <h3>Your inbox is empty</h3>
          <p>Incoming emails will appear here automatically.</p>
        </div>
      </div>
    </main>

    <footer>Copyright &copy; 2026 Cavela Mail. All rights reserved.</footer>
  </div>

  <!-- MODAL VIEW EMAIL PENUH -->
  <div class="email-modal-overlay" id="emailModal">
    <div class="email-modal-box">
      <div class="modal-top-bar">
        <div>
          <div class="modal-subject" id="modalSubject">Subjek Email</div>
          <div class="modal-meta" id="modalSender">Dari: -</div>
        </div>
        <button class="modal-close-btn" id="closeModalBtn">Close</button>
      </div>
      <div class="modal-iframe-container">
        <iframe id="modalIframe" class="modal-iframe" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://ca-vela-mailbox.pinkeuzie.workers.dev";

    const domainTrigger = document.getElementById('domainTrigger');
    const domainMenu = document.getElementById('domainMenu');
    const selectedDomainText = document.getElementById('selectedDomainText');
    const usernameInput = document.getElementById('usernameInput');
    const setEmailBtn = document.getElementById('setEmailBtn');
    const currentEmailDisplay = document.getElementById('currentEmailDisplay');
    const copyBtn = document.getElementById('copyBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const refreshIcon = document.getElementById('refreshIcon');
    const inboxContentArea = document.getElementById('inboxContentArea');
    const msgCounter = document.querySelector('.msg-counter');

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeMenu = document.getElementById('themeMenu');

    const emailModal = document.getElementById('emailModal');
    const modalSubject = document.getElementById('modalSubject');
    const modalSender = document.getElementById('modalSender');
    const modalIframe = document.getElementById('modalIframe');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let chosenDomain = 'cavela.my.id';
    let parsedEmailsCache = [];

    const themes = {
      strawberry: { bgCream: '#fff5f6', berryDark: '#5c1624', berryRed: '#ff3b5c', berrySoft: '#ff758f', berryPastel: '#ffe3e8', berryBorder: '#f8bbd0', textMuted: '#9e6b75' },
      matcha: { bgCream: '#f4fbf7', berryDark: '#134e26', berryRed: '#27ae60', berrySoft: '#2ecc71', berryPastel: '#e1f5e9', berryBorder: '#c8e6c9', textMuted: '#558b6e' },
      blueberry: { bgCream: '#f0f7ff', berryDark: '#103456', berryRed: '#2980b9', berrySoft: '#3498db', berryPastel: '#e3f2fd', berryBorder: '#bbdefb', textMuted: '#547a9e' },
      taro: { bgCream: '#fbf5ff', berryDark: '#3b1456', berryRed: '#8e44ad', berrySoft: '#9b59b6', berryPastel: '#f3e5f5', berryBorder: '#e1bee7', textMuted: '#7b5a8e' }
    };

    function applyTheme(themeName) {
      const t = themes[themeName];
      if (!t) return;
      const r = document.documentElement;
      r.style.setProperty('--bg-cream', t.bgCream);
      r.style.setProperty('--berry-dark', t.berryDark);
      r.style.setProperty('--berry-red', t.berryRed);
      r.style.setProperty('--berry-soft', t.berrySoft);
      r.style.setProperty('--berry-pastel', t.berryPastel);
      r.style.setProperty('--berry-border', t.berryBorder);
      r.style.setProperty('--text-muted', t.textMuted);
      localStorage.setItem('mailbox_theme', themeName);
    }

    themeToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      themeMenu.classList.toggle('open');
      domainMenu.classList.remove('open');
    });

    document.querySelectorAll('.theme-option').forEach(opt => {
      opt.addEventListener('click', () => {
        applyTheme(opt.getAttribute('data-theme'));
        themeMenu.classList.remove('open');
      });
    });

    domainTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      domainMenu.classList.toggle('open');
      domainTrigger.classList.toggle('active');
      themeMenu.classList.remove('open');
    });

    document.querySelectorAll('.dropdown-option').forEach(opt => {
      opt.addEventListener('click', () => {
        chosenDomain = opt.getAttribute('data-domain');
        selectedDomainText.textContent = chosenDomain;
        domainMenu.classList.remove('open');
        domainTrigger.classList.remove('active');
      });
    });

    document.addEventListener('click', () => {
      domainMenu.classList.remove('open');
      domainTrigger.classList.remove('active');
      themeMenu.classList.remove('open');
    });

    closeModalBtn.addEventListener('click', () => {
      emailModal.classList.remove('open');
    });

    emailModal.addEventListener('click', (e) => {
      if (e.target === emailModal) emailModal.classList.remove('open');
    });

    // Fungsi Decode Quoted-Printable (mengubah =3D menjadi =, dll agar tag <img> tidak rusak)
    function decodeQuotedPrintable(str) {
      let cleaned = str.replace(/=\r?\n/g, '');
      try {
        return decodeURIComponent(
          cleaned
            .replace(/%/g, '%25')
            .replace(/=([0-9A-F]{2})/gi, '%$1')
        );
      } catch (e) {
        return cleaned.replace(/=([0-9A-F]{2})/gi, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
      }
    }

    // Fungsi Decode Base64 UTF-8
    function decodeBase64(str) {
      try {
        const cleanB64 = str.replace(/[^A-Za-z0-9+/=]/g, '');
        const binary = atob(cleanB64);
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        return str;
      }
    }

    // Ekstraktor Pintar: Mengutamakan text/html agar Gambar, Logo & Tombol muncul sempurna
    function extractRichEmailContent(raw) {
      if (!raw) return "<p>(Tidak ada isi pesan)</p>";

      // Jika isi sudah berupa HTML bersih (bukan MIME mentah)
      if (!raw.includes('Content-Type:') && (raw.includes('<html') || raw.includes('<div') || raw.includes('<table') || raw.includes('<img'))) {
        return raw;
      }

      // 1. Cari bagian blok text/html terlebih dahulu
      const htmlPartRegex = /Content-Type:\s*text\/html[\s\S]*?(?:\r?\n\r?\n)([\s\S]*?)(?=\r?\n--[^\r\n]+|$)/i;
      const htmlMatch = raw.match(htmlPartRegex);

      if (htmlMatch) {
        const fullHtmlBlock = htmlMatch[0];
        let htmlBody = htmlMatch[1].trim();
        const headerPart = fullHtmlBlock.substring(0, fullHtmlBlock.indexOf(htmlMatch[1]));

        if (/Content-Transfer-Encoding:\s*quoted-printable/i.test(headerPart) || htmlBody.includes('=3D')) {
          htmlBody = decodeQuotedPrintable(htmlBody);
        } else if (/Content-Transfer-Encoding:\s*base64/i.test(headerPart)) {
          htmlBody = decodeBase64(htmlBody);
        }

        // Bersihkan sisa boundary di ujung jika ada
        htmlBody = htmlBody.replace(/\r?\n--[^\r\n]+--\s*$/g, '');
        return htmlBody;
      }

      // 2. Jika tidak ada text/html, cari text/plain
      const plainPartRegex = /Content-Type:\s*text\/plain[\s\S]*?(?:\r?\n\r?\n)([\s\S]*?)(?=\r?\n--[^\r\n]+|$)/i;
      const plainMatch = raw.match(plainPartRegex);

      if (plainMatch) {
        const fullPlainBlock = plainMatch[0];
        let plainBody = plainMatch[1].trim();
        const headerPart = fullPlainBlock.substring(0, fullPlainBlock.indexOf(plainMatch[1]));

        if (/Content-Transfer-Encoding:\s*quoted-printable/i.test(headerPart) || plainBody.includes('=3D')) {
          plainBody = decodeQuotedPrintable(plainBody);
        } else if (/Content-Transfer-Encoding:\s*base64/i.test(headerPart)) {
          plainBody = decodeBase64(plainBody);
        }

        return `<div style="white-space: pre-wrap; font-family: 'Quicksand', sans-serif;">${plainBody}</div>`;
      }

      // 3. Fallback: buang header MIME dan decode jika ada kode =3D
      const splitIndex = raw.search(/\r?\n\r?\n/);
      let fallbackBody = splitIndex !== -1 ? raw.substring(splitIndex).trim() : raw;
      if (fallbackBody.includes('=3D') || fallbackBody.includes('=\r\n') || fallbackBody.includes('=\n')) {
        fallbackBody = decodeQuotedPrintable(fallbackBody);
      }

      if (fallbackBody.includes('<html') || fallbackBody.includes('<table') || fallbackBody.includes('<div') || fallbackBody.includes('<img')) {
        return fallbackBody;
      }

      return `<div style="white-space: pre-wrap; font-family: 'Quicksand', sans-serif;">${fallbackBody}</div>`;
    }

    // Membungkus HTML untuk ditampilkan rapi di dalam iframe
    function buildIframeSrcdoc(contentHtml) {
      return `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_blank">
  <style>
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #222;
      background-color: #ffffff;
      word-wrap: break-word;
    }
    img {
      max-width: 100% !important;
      height: auto !important;
    }
    table {
      max-width: 100% !important;
    }
    a {
      color: #ff3b5c;
    }
  </style>
</head>
<body>
  ${contentHtml}
</body>
</html>`;
    }

    function openEmailModal(index) {
      const item = parsedEmailsCache[index];
      if (!item) return;
      modalSubject.textContent = item.subject || '(Tanpa Subjek)';
      modalSender.textContent = `Dari: ${item.sender}`;
      modalIframe.srcdoc = item.srcdoc;
      emailModal.classList.add('open');
    }

    window.openEmailModal = openEmailModal;

    async function loadInbox() {
      const activeEmail = currentEmailDisplay.textContent.trim();
      inboxContentArea.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 30px; font-weight: 600;">Memuat pesan masuk...</p>`;

      try {
        const response = await fetch(`${WORKER_URL}/api/messages?email=${activeEmail}`);
        const emails = await response.json();

        msgCounter.textContent = `${emails.length} pesan masuk`;

        if (!emails || emails.length === 0) {
          inboxContentArea.innerHTML = `
            <div class="empty-inbox">
              <div class="empty-icon">
                <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
                  <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
                </svg>
              </div>
              <h3>Your inbox is empty</h3>
              <p>Incoming emails will appear here automatically.</p>
            </div>
          `;
          return;
        }

        parsedEmailsCache = [];
        inboxContentArea.innerHTML = '';

        emails.forEach((mail, idx) => {
          const rawContent = mail.html || mail.body || '';
          const richHtml = extractRichEmailContent(rawContent);
          const srcdoc = buildIframeSrcdoc(richHtml);

          parsedEmailsCache.push({
            sender: mail.sender,
            subject: mail.subject,
            srcdoc: srcdoc
          });

          const itemDiv = document.createElement('div');
          itemDiv.className = 'email-item';

          const headerDiv = document.createElement('div');
          headerDiv.className = 'email-header-clickable';
          headerDiv.onclick = () => openEmailModal(idx);

          const infoDiv = document.createElement('div');

          const senderEl = document.createElement('div');
          senderEl.style.cssText = 'font-weight: 700; font-size: 0.9rem; color: var(--berry-dark); margin-bottom: 4px;';
          senderEl.textContent = `Dari: ${mail.sender}`;

          const subjectEl = document.createElement('div');
          subjectEl.style.cssText = 'font-weight: 700; font-size: 0.88rem; color: var(--berry-red); margin-bottom: 4px;';
          subjectEl.textContent = `Subjek: ${mail.subject}`;

          infoDiv.appendChild(senderEl);
          infoDiv.appendChild(subjectEl);

          const openBtn = document.createElement('button');
          openBtn.className = 'open-modal-btn';
          openBtn.textContent = 'Buka Penuh ↗';

          headerDiv.appendChild(infoDiv);
          headerDiv.appendChild(openBtn);

          const bodyWrapper = document.createElement('div');
          bodyWrapper.className = 'email-body-wrapper';

          const iframe = document.createElement('iframe');
          iframe.className = 'email-iframe';
          iframe.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox');
          iframe.srcdoc = srcdoc;

          // Sesuaikan tinggi iframe otomatis dengan isi gambar/email
          iframe.onload = () => {
            try {
              const doc = iframe.contentDocument || iframe.contentWindow.document;
              if (doc && doc.body) {
                const h = Math.min(Math.max(doc.body.scrollHeight + 24, 220), 420);
                iframe.style.height = h + 'px';
              }
            } catch (e) {}
          };

          bodyWrapper.appendChild(iframe);
          itemDiv.appendChild(headerDiv);
          itemDiv.appendChild(bodyWrapper);
          inboxContentArea.appendChild(itemDiv);
        });

      } catch (err) {
        console.error(err);
        inboxContentArea.innerHTML = `<p style="text-align:center; color: var(--berry-red); padding: 30px; font-weight: 600;">Gagal memuat pesan dari server.</p>`;
      }
    }

    setEmailBtn.addEventListener('click', () => {
      const user = usernameInput.value.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '') || 'berrysweet';
      currentEmailDisplay.textContent = `${user}@${chosenDomain}`;
      domainMenu.classList.remove('open');
      loadInbox();
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(currentEmailDisplay.textContent);
      copyBtn.textContent = 'Tersalin! 🍓';
      setTimeout(() => { copyBtn.textContent = 'Salin'; }, 1800);
    });

    refreshBtn.addEventListener('click', () => {
      refreshIcon.classList.remove('spin');
      void refreshIcon.offsetWidth; 
      refreshIcon.classList.add('spin');
      loadInbox();
    });

    window.onload = () => {
      const savedTheme = localStorage.getItem('mailbox_theme') || 'strawberry';
      applyTheme(savedTheme);
      loadInbox();
    };
  </script>
</body>
</html>
