<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox | Mailbox Cavela</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #fff5f6;
      --card-bg: #ffffff;
      --berry-dark: #5c1624;
      --berry-red: #ff3b5c;
      --berry-soft: #ff758f;
      --berry-pastel: #ffe3e8;
      --berry-border: #f8bbd0;
      --leaf-green: #2ecc71;
      --text-muted: #9e6b75;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-cream);
      background-image: radial-gradient(#ffd1da 1.5px, transparent 1.5px), radial-gradient(#ffe5ec 1.5px, var(--bg-cream) 1.5px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--berry-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 16px 36px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(255, 59, 92, 0.08);
      border: 2px solid #fff;
      position: relative;
    }

    .header-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 22px;
    }

    .brand-title { text-align: center; }
    .brand-title h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.65rem;
      color: var(--berry-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.1;
    }

    .brand-title span.subtitle {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--berry-red);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .theme-btn {
      position: absolute;
      right: 18px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--berry-pastel);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--berry-red);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .theme-btn:hover {
      transform: rotate(15deg) scale(1.06);
      background: #ffd0d9;
    }

    .theme-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 18px;
      background: #ffffff;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 12px 28px rgba(92, 22, 36, 0.14);
      border: 1.5px solid var(--berry-pastel);
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .theme-menu.open { display: flex; animation: popDown 0.18s ease-out; }

    @keyframes popDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-option {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--berry-dark);
      transition: background 0.15s;
    }

    .theme-option:hover { background: var(--berry-pastel); }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; }

    .email-card-title {
      text-align: center;
      font-weight: 700;
      font-size: 1.02rem;
      color: var(--berry-dark);
      margin-bottom: 16px;
    }

    .form-grid { display: flex; gap: 12px; align-items: stretch; }
    .inputs-col { flex: 1; display: flex; flex-direction: column; gap: 10px; position: relative; }

    .input-box {
      width: 100%;
      padding: 13px 16px;
      border-radius: 15px;
      border: 1.8px solid var(--berry-border);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--berry-dark);
      background: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-box::placeholder { color: #c99aa3; font-weight: 500; }
    .input-box:focus { border-color: var(--berry-red); box-shadow: 0 0 0 3px rgba(255, 59, 92, 0.12); }

    .select-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-color: #9e3d50;
    }

    .select-trigger svg { transition: transform 0.25s ease; }
    .select-trigger.active svg { transform: rotate(180deg); }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 105%;
      background: #ffffff;
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 12px 28px rgba(92, 22, 36, 0.14);
      border: 1.5px solid var(--berry-pastel);
      z-index: 30;
      display: none;
    }

    .dropdown-menu.open { display: block; animation: popDown 0.18s ease-out; }

    .dropdown-option {
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.96rem;
      color: var(--berry-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .dropdown-option:hover { background: var(--berry-pastel); color: var(--berry-red); }

    .submit-arrow-btn {
      width: 56px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(180deg, var(--berry-soft) 0%, var(--berry-red) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 59, 92, 0.28);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .submit-arrow-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .submit-arrow-btn:active { transform: scale(0.96); }

    .active-email-bar {
      margin-top: 12px;
      background: var(--berry-pastel);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--berry-dark);
    }

      background: #fff;
      color: var(--berry-red);
      border: none;
